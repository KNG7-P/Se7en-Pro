name: CI

# Compiles every push and pull request WITHOUT access to any secret. This is
# the guard that a fork can pass: it proves the tree still builds with the
# placeholder branch of EmbeddedValues.cs and no injected secrets present.
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (win-x64, win-x86)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify no secret material is committed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = git ls-files
          $bad = @()
          foreach ($p in $tracked) {
            if ($p -match 'server_entries\.(bin|txt)$') { $bad += $p }
            if ($p -match '\.toml$')                    { $bad += $p }
            if ($p -match 'BuildSecrets\.g\.cs$')        { $bad += $p }
            if ($p -match 'EmbeddedValues\.plaintext\.json$') { $bad += $p }
          }
          if ($bad.Count) {
            Write-Host "Sensitive files are tracked:" -ForegroundColor Red
            $bad | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            exit 1
          }
          Write-Host "No secret material tracked ($($tracked.Count) files)."

      - name: Confirm secrets really are absent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'Se7enPro/Services/BuildSecrets.g.cs') {
            Write-Host 'BuildSecrets.g.cs must not exist in a clean checkout.' -ForegroundColor Red
            exit 1
          }

      - name: Restore
        run: dotnet restore Se7enPro/Se7enPro.csproj

      - name: Build win-x64
        run: dotnet build Se7enPro/Se7enPro.csproj -c Release -r win-x64 --no-restore --self-contained false -warnaserror

      - name: Build win-x86
        run: dotnet build Se7enPro/Se7enPro.csproj -c Release -r win-x86 --self-contained false -warnaserror

  secrets-injection:
    name: Secret injection dry run
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Generate with dummy values and compile the injected branch
        shell: pwsh
        env:
          SE7EN_PROPAGATION_CHANNEL_ID: ci-dummy-channel
          SE7EN_SPONSOR_ID: ci-dummy-sponsor
          SE7EN_CLIENT_VERSION: '1'
          SE7EN_CLIENT_PLATFORM: Windows
          SE7EN_REMOTE_SERVER_LIST_SIGNATURE_PUBLIC_KEY: ci-dummy-remote-key
          SE7EN_SERVER_ENTRY_SIGNATURE_PUBLIC_KEY: ci-dummy-entry-key
          SE7EN_FEEDBACK_ENCRYPTION_PUBLIC_KEY: ci-dummy-feedback-key
          SE7EN_REMOTE_SERVER_LIST_URLS_JSON: '[{"URL":"YQ==","OnlyAfterAttempts":0,"SkipVerify":false}]'
          SE7EN_OBFUSCATED_SERVER_LIST_ROOT_URLS_JSON: '[{"URL":"Yg==","OnlyAfterAttempts":0,"SkipVerify":false}]'
          SE7EN_FEEDBACK_UPLOAD_URLS_JSON: '[{"URL":"Yw==","OnlyAfterAttempts":0,"SkipVerify":false}]'
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/generate_build_secrets.py
          dotnet build Se7enPro/Se7enPro.csproj -c Release -r win-x64 --self-contained false
          # SE7EN_SECRETS must now be active, proving the injected branch is live.
          if (-not (Test-Path 'Se7enPro/obj')) { Write-Host 'no obj dir'; exit 1 }
          $gen = Get-Content 'Se7enPro/Services/BuildSecrets.g.cs' -Raw
          if ($gen -notmatch 'class BuildSecrets') { Write-Host 'generator produced no BuildSecrets'; exit 1 }
          Write-Host 'Injected branch compiled.'